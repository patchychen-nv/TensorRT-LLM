version: 0.0.1
l0_gb300_multi_gpus:
- condition:
    ranges:
      system_gpu_count:
        gte: 4
        lte: 4
    wildcards:
      gpu:
      - '*gb110*'
      - '*gb300*'
      linux_distribution_name: ubuntu*
      cpu: aarch64
    terms:
      stage: post_merge
      backend: pytorch
  tests:
  # One ordered sequence in one job: the cases share module-global rank state.
  - unittest/_torch/modeling_v2/comm
  - accuracy/test_modeling_v2_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm103Dep4::test_gsm8k_identity_vs_mtp3
  - accuracy/test_modeling_v2_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm103Dep4::test_mtp3_acceptance[modeling_v2]
  - accuracy/test_modeling_v2_deepseek_v3.py::TestModelingV2DeepseekR10528Nvfp4Sm103Dep4::test_mtp3_acceptance[stock]
  # Covers tests/unittest/_torch/attention/. Two sub-trees moved in here from elsewhere
  # under tests/unittest/_torch/ and have no entry of their own on any list, so this entry
  # is what picks them up:
  #   kernels/    fused attention kernels (ex thop/ and custom_ops/)
  #   multi_gpu/  helix tests -- each case spawns a 2-rank MPIPoolExecutor pinned to GPU 0/1
  #               by absolute index, and they gate on >= 2 GPUs plus Blackwell. They also
  #               rebind mpi4py's serializer at import time, which applies process-wide on
  #               every stage that collects them, including where the tests themselves skip.
  - unittest/_torch/attention TIMEOUT (120)
  - unittest/_torch/thop/parallel
  - unittest/_torch/visual_gen/kernels/parallel
  - unittest/_torch/thop/serial
  - unittest/_torch/executor
  - unittest/_torch/disaggregation
