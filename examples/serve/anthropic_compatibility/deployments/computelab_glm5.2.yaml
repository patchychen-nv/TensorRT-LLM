#
# GLM-5.2-NVFP4 on computelab (umbriel B200, 8 GPU/node). TP8 lands on one node.
#   ./serve.sh submit --yaml deployments/computelab_glm5.2.yaml --label bringup

cluster_name: computelab
repo_dir: /home/scratch.serli_gpu/workspace/TensorRT-LLM

model:
  # Must be one of the names serve.sh recognises; see KNOWN_MODELS in serve.sh.
  # With cluster_name it names the Slurm job, the container, and the trace dir.
  name: glm5.2
  # The basename also becomes the pkill pattern, since that is what shows up on
  # the trtllm-serve command line.
  path: /home/scratch.trt_llm_data/llm-models/GLM-5.2-NVFP4
  tool_parser: glm47

slurm:
  account: mlpinf
  partition: b200@cr+mp-1000W/umbriel-b200@ts4/8gpu-224cpu-2048gb
  reservation: RES--OWN--COM-3781--mlpinf-a01r
  qos: reservation
  time: "10:00:00"
  nodes: 1
  gpus_per_node: 8
  extra_args: []

container:
  image: /home/scratch.serli_gpu/workspace/containers/tensorrt-llm-pytorch-26.05-py3-x86_64-ubuntu24.04-trt10.16.1.11-skip-tritondevel-202607151440-16194.sqsh
  mounts:
    - /home/scratch.serli_gpu:/home/scratch.serli_gpu
    - /home/scratch.trt_llm_data:/home/scratch.trt_llm_data
    - /raid:/raid

server:
  # trtllm-serve --config; relative paths resolve against this file's directory.
  config: server_configs/glm5.2_agg_tep8.yaml
  port: 8333
  install_repo: true
  numactl: "0,1"
  extra_args: []
  env: {}

trace:
  root: /home/scratch.serli_gpu/workspace/claude-traces

# Optional. Without this section everything above still works; only
# `serve.sh gateway` needs it.
gateway:
  port: 8333
  # CPU only -- the gateway proxies and never touches a GPU. This partition
  # allows 7 days, so the address outlives ~40 serving jobs.
  partition: "-/lego-c2@qs/0gpu-144cpu-480gb"
  time: "7-00:00:00"
  # Relative to this file. One username per line; the gateway checks every
  # request against it and rereads the file when it changes.
  users: gateway_users.txt
  # Submit the successor this long before the wall clock. Must cover queue wait
  # plus pip install plus weight load, with room for the handover.
  lead_time: 2700
  # Pinned so the address survives a gateway restart: without it the job lands
  # on whichever node is free and everyone has to be told the new URL. The cost
  # is that the gateway queues if this node is drained -- move it to another
  # lego-c2-qs-* node when that happens.
  extra_args: ["--nodelist=lego-c2-qs-26"]
