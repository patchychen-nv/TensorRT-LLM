# The fleet Kernel Factory is pointed at: several disaggregated deployments
# behind one gateway, each configured on its own.
#
#   ./fleetctl up          bring every instance up
#   ./fleetctl status      what is running against what is configured
#   ./fleetctl roll a      replace one instance without dropping traffic
#   ./fleetctl down a      stop one
#
# Instances are independent on purpose. They differ in prefill/decode ratio,
# and the right ratio is not known yet -- agent turns replay their whole
# history, so this workload is prefill-heavy in a way ordinary chat is not, and
# the only way to find the ratio is to run more than one and compare.
#
# Every instance registers into the SAME fleet directory. serve.sh names each
# registration after its job id, so they do not collide, and the gateway
# discovers the directory rather than any one file -- which is what makes them
# one pool instead of four unrelated servers.

defaults:
  # cluster_name and model.name key the fleet directory. Identical across
  # instances BY DESIGN: serli's file warns that sharing them makes two
  # deployments register as backends of each other, which is exactly what is
  # wanted here and the opposite of what it wanted there.
  cluster_name: kffleet
  repo_dir: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM

  model:
    # Keys the fleet directory (<cluster_name>_<name>): changing it moves the
    # registration dir, and the gateway must be restarted with the matching
    # GW_FLEET_NAME or it will watch the old, empty one and 503 everything.
    name: glm5.3
    # The JET distribution. Must be the /scratch/fsw spelling: /lustre/fsw is
    # the same filesystem but is NOT in container.mounts, and a path that does
    # not exist inside the container is treated as a HuggingFace repo id --
    # the failure reads as HFValidationError, not as a missing mount.
    # FP8 (704 GB), not the nvfp4 variant beside it. That one is modelopt
    # MIXED_PRECISION -- dense MLP FP8, experts NVFP4, MTP excluded -- and the
    # GLM/DeepSeek decoder layer cannot load it: modeling_deepseekv3.py
    # asserts "MIXED_PRECISION is ambiguous" at layer build (its own FIXME
    # admits the gap), on rc26 and on main alike. Four attempts of job 556811
    # died there before loading a weight, 2026-09-21. Return here when the
    # per-layer resolution lands upstream; until then FP8 forces DEP8 ctx
    # workers and 10-node instances.
    path: /scratch/fsw/portfolios/coreai/projects/coreai_dlalgo_ci/artifacts/model/zai-org_glm-5.3/hf/hf-e0b07fd_orig
    # Unchanged from 5.2 and measured, not assumed: 5.3 is still model_type
    # glm_moe_dsa / GlmMoeDsaForCausalLM, same tool markup, same parser.
    tool_parser: glm47

  slurm:
    account: coreai_kf_dev
    partition: batch_long
    # normal, not interactive. interactive has priority 700 but caps at
    # MaxTRESPU node=4 with DenyOnLimit -- one 8-node instance would be
    # rejected outright rather than queued. The 1.7 min median queue wait that
    # used to be recorded here was measured at 4 nodes and no longer describes
    # what this fleet does: at 8 nodes, with `segment: auto` below requiring
    # them in one block, three instances that expired on 2026-09-16 waited
    # 3h20m to get back in at priority ~96.7k against a 408-deep batch_long
    # queue -- while 4500 nodes sat idle, because a 1-node job fits anywhere
    # and an 8-node single-rack one does not.
    qos: normal
    # The partition allows 7 days (MaxTime=7-00:00:00); 24h was our own choice
    # and it is the expensive one. The two ways an instance ends are not
    # symmetric:
    #
    #   TIMEOUT    the job ends, the allocation is gone, and fleetctl's
    #              replacement re-enters that queue from the back -- 3h20m,
    #              measured.
    #   PREEMPTED  PreemptMode=REQUEUE keeps the job id, and it was running
    #              again 100 seconds later with its clock reset -- measured on
    #              i00 the same night.
    #
    # So the thing worth minimising is expiries, not preemptions, and a 7-day
    # limit takes the fleet from ~14 of them a day to ~2. Preemption remains
    # the common case and stays cheap.
    time: "7-00:00:00"
    gpus_per_node: 4
    # Each 2-node worker inside one NVL72 rack; the instance itself may span
    # racks. 2026-10-06: `auto` (all 14 nodes in one rack) left the whole fleet
    # pending for hours in a maintenance-depleted batch_long, so the instance
    # was opened up to cross-rack placement once UCX_TLS below gained an RDMA
    # path (rc over the rdma_vf rails) for ctx->gen KV transfer.
    #
    # Not unconstrained, though. Every ctx and gen worker is DEP8 over 2 nodes,
    # and a worker split across racks has no NVLink between its halves while
    # MnnvlMemory.supports_mnnvl() only checks the LOCAL links - so the MoE
    # still picks the NVLink all-to-all. Measured before `auto` was set: of
    # instances whose nodes landed in more racks than half their node count,
    # 81% hit the MNNVL peer-access failure; of the compact ones, 5%.
    #
    # --segment=2 keeps every pair in one block, and the pairs line up with the
    # workers: serve.sh slices `scontrol show hostnames` (sorted, so grouped by
    # nvl72dNNN block) into consecutive 2-node workers from offset 0, and each
    # block contributes an even number of nodes. Change this with the worker
    # size: it must equal the nodes per worker, and divide the node count.
    segment: 2
    # Exemption from the cluster's Occupied Idle Job Reaper (job-level
    # --comment JSON, format per HWINFCSSUP "GPU Idle Time Exemption Guide").
    # The reaper cancels a job whose GPUs show DCGM SM_ACTIVE <= 0.01 for
    # 30 min. Every start and in-allocation restart spends 20-50 min with idle
    # SMs (pip install of the checkout, weights read from Lustre, startup
    # profiling) - on 2026-10-06 instances were reaped ~31 min into a start
    # and during crash recovery. 60 min covers a cold start; inference_server
    # is the reason code for a server that must stay up between bursts. Keep
    # it no longer than needed: exemptions are monitored.
    extra_args:
      - '--comment={"OccupiedIdleGPUsJobReaper":{"exemptIdleTimeMins":"60","reason":"inference_server","description":"TRT-LLM disaggregated inference server for agent data generation: each start installs the checkout and loads 0.7-1.4 TB of weights (20-50 min with idle SMs) and the server must stay up between request bursts"}}'

  container:
    # The image `jenkins/current_image_tags.properties` pins for this source
    # tree, imported under our own sqsh/. Keep these two in step: the compiled
    # artifacts in tensorrt_llm/libs are built inside this image, so pairing a
    # different one with them is an untested combination.
    image: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/sqsh/sw-tensorrt-llm-docker-local+tensorrt-llm+pytorch-26.05-py3-sbsa-ubuntu24.04-skip-tritondevel-202608271702-17084.sqsh
    mounts:
      - /scratch/fsw:/scratch/fsw
      # /lustre/fsw, where trace.request_root points, is mounted by default on
      # this cluster and so is deliberately absent here.

  server:
    install_repo: true
    numactl: "0,1"
    capture: true
    # Dump the model text before the reasoning and tool parsers, one jsonl per
    # UTC hour per pid under <attempt>/raw_output. Kept ON for the first
    # Kernel-Trace pass by decision of 2026-09-22: measured 47MB per ~10
    # campaigns against 3.3GB engine logs per attempt, and it is the artifact
    # every parser investigation this month started from. Turn off later by
    # flipping this and restarting instances, or prune with find -mtime.
    raw_output: true
    # NIXL's UCX plugin, patched. The image ships NIXL v1.4.0, whose endpoint
    # error callback force-closes the UCP endpoint but keeps the pointer; the
    # next metadata load for that peer then unpacks rkeys against freed memory
    # and SIGSEGVs every rank of the context worker
    # (ucp_ep_rkey_unpack_internal <- nixlUcxEngine::internalMDHelper <-
    # NixlTransferAgent::loadRemoteAgent). On a pair of nodes whose endpoints
    # fail, that is every attempt: 7 of 7 on two instances on 2026-10-06.
    # NIXL v1.5.0 fixed it upstream (the callback only marks the endpoint
    # failed, closeImpl force-closes it); this .so is that change applied to the
    # v1.4.0 source and built inside this image -- its exported symbols and
    # NEEDED entries match the stock plugin. A failed endpoint now costs the
    # transfers on it (and logs "UCX endpoint ... failed: <status>"), not the
    # worker. Drop this once the image's NIXL is >= 1.5.0. The checksum makes a
    # missing or different file fail the start instead of running unpatched.
    post_install:
      - >-
        echo "478e574dacb967e082626d00e0a7d06519c60138d5a1991066c0161b3f98d5de  /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/nixl_fix/out/nixl140fix-26.05/libplugin_UCX.so" | sha256sum -c -
        && cp -f /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/nixl_fix/out/nixl140fix-26.05/libplugin_UCX.so /opt/nvidia/nvda_nixl/lib/aarch64-linux-gnu/plugins/libplugin_UCX.so
    extra_args: []
    env:
      TLLM_LOG_LEVEL: INFO
      # The cyclic GC must stay on in every process that parses requests: see ENV_DEFAULTS in serve.sh.
      TRTLLM_SERVER_DISABLE_GC: "0"
      TRTLLM_DISAGG_SERVER_DISABLE_GC: "0"
      TRTLLM_WORKER_DISABLE_GC: "1"
      # Attached frontends re-import the package before READY; on 10-08 that took >300s and
      # the default timeout tore down every instance right after its weight load.
      TLLM_FRONTEND_READY_TIMEOUT: "1800"
      TRTLLM_ENABLE_PDL: "1"
      TRTLLM_ANTHROPIC_LCP_TRACKING: "1"
      ENROOT_ALLOW_DEV: "yes"
      NCCL_GRAPH_MIXING_SUPPORT: "0"
      MIMALLOC_PURGE_DELAY: "0"
      TLLM_PROFILE_LOG_RANKS: all
      # Off everywhere, ctx too: a per-process 16-entry store can't back previous_response_id here.
      TRTLLM_RESPONSES_API_DISABLE_STORE: "1"

      # KV transfer transport, for instances that span racks (`segment: 2`
      # above). 2026-10-06: rc over the four rdma_vf rails gives cross-rack
      # ctx->gen KV transfer an RDMA path; without it a cross-rack transfer
      # falls back to TCP and merely gets slow. DEVX off, the rails named
      # explicitly, and traffic class 96 (the cluster's RoCE lossless class).
      #
      # serve.sh exports this inside the worker shell rather than through
      # --export, because the GPU nodes' enroot environ.d injects UCX_TLS=tcp
      # after srun's environment and would otherwise win.
      #
      # WATCH ON EVERY START: UCX's `rc` still opens a UD interface for wireup,
      # and UD QP creation is exactly what failed on the SR-IOV-starved nodes
      # in the history below. If "failed to create UD QP" or "createBackend:
      # backend creation failed for 'UCX'" reappears, exclude those nodes
      # (slurm.extra_args --exclude) or fall back to the TCP-only list.
      UCX_TLS: "rc,tcp,cuda_ipc,cuda_copy,sm,self"
      UCX_IB_MLX5_DEVX: "n"
      UCX_NET_DEVICES: "rdma_vf_rail0:1,rdma_vf_rail1:1,rdma_vf_rail2:1,rdma_vf_rail3:1"
      UCX_IB_TRAFFIC_CLASS: "96"
      #
      # History - the single-rack, TCP-only list this replaced, and why it was
      # adopted (2026-09-13). The configuration before THAT turned DEVX off
      # and named the four rdma_vf_rail devices, which left ud_verbs as the
      # only wireup transport. ud_verbs opens each interface with a UD QP, four
      # rails times four ranks per node, against an SR-IOV pool too small for
      # them:
      #
      #   failed to create UD QP TX wr:256 sge:6 inl:64 RX wr:256 ...
      #       Cannot allocate memory
      #   nixl_agent.cpp:404 createBackend: backend creation failed for 'UCX'
      #
      # NIXL then could not create its backend and the worker never reached
      # ready, which presented as an instance that starts and never serves.
      # Shrinking the queue to a sixteenth of the default did not fix it: the
      # message above is from a run that already had RX wr:256. It accounted
      # for 17% of all fleet node-hours across 2026-09-11..13, concentrated on
      # 44 of 865 nodes -- a node property, not a load one.
      #
      # Naming no IB transport removes the UD QP entirely, so the failure
      # cannot occur on any node. Verified by rolling i03 onto this list while
      # its allocation still contained a node from the known-bad list: 4 UD QP
      # failures and 22 NIXL failures before, 0 and 0 after, 7/7 workers up.
      # (the TCP-only list, kept here as the fallback named above:)
      # UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"

      # Kept, though the note this replaced grouped it with the four transport
      # settings that went. It bounds NIXL's own worker threads and says
      # nothing about which transport it picks, and the configuration validated
      # on i03 had it -- deploying something that differs from what was
      # measured is how a verified result stops being evidence for what runs.
      TRTLLM_NIXL_NUM_THREADS: "1"

      # Measured on aga: a cold start is ~36 min without this and 14.5 min with
      # it, because ~30 of those minutes are FlashInfer compiling JIT modules
      # that otherwise land under $HOME inside the container and die with it.
      # At 30 instances against a 4h05m preemption exemption, paying that again
      # on every restart is most of the fleet's recovery time.
      #
      # Setting it explicitly also disables the per-rank isolation in
      # mpi_session.py, which is the point: that bootstrap gives each rank its
      # own `rank-<n>` directory, so thirty 32-rank instances would compile the
      # same modules hundreds of times over. Concurrent *hits* into one
      # directory on Lustre are measured safe (three instances, 11 of 14 files
      # rewritten, no stall); concurrent first-compiles are not, so warm the
      # cache with a single instance before bringing up the rest.
      #
      # Must be writable: a cache hit still rewrites ~31 files.
      # The glm5.3 cache the test fleet warmed. Sharing holds exactly while
      # both fleets run the same build against the same checkpoint, which
      # they do: one repo_dir, one model path. The old /flashinfer directory
      # holds 5.2-NVFP4 signatures and would first-compile everything here.
      # The FP8 cache the test fleet warmed: same build, same checkpoint, so
      # the sharing premise holds and both instances may start concurrently
      # (concurrent HITS are measured safe; only first-compiles are not).
      FLASHINFER_WORKSPACE_BASE: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/flashinfer-glm53
    disagg:
      start_timeout: 7200

  gateway:
    # How a backend announces itself. Unset means the file drop: serve.sh
    # writes into <trace.root>/_fleet/<cluster>_<model> and the gateway reads
    # that directory, which works precisely while the two share a filesystem.
    #
    # They do not when the gateway runs outside the cluster -- and there is a
    # good reason to put it there. Everything the gateway does is in service of
    # one URL that does not move, and inside the scheduler that costs the whole
    # chain in gateway.sbatch: a successor submitted at every start, pinned to
    # one node, with a gap at each handover and a thrash guard that will refuse
    # to continue. A host with no wall clock needs none of it.
    #
    # Setting register_url makes each job POST to /_gateway/backend instead.
    # The gateway probes the address before accepting and writes the same
    # record itself, so discovery, routing and the analysis all stay as they
    # are. It repeats every sixty seconds rather than announcing once, because
    # a gateway that restarts comes up with an empty directory and nothing else
    # would put this backend back in it.
    #
    # Commented out until jhb -> ipp2 HTTP is confirmed to work: the traffic
    # this needs is outbound from a compute node, which is exactly what fails
    # for Kernel Factory from there. The reverse direction is known good.
    #
    # register_url: http://ipp2-1730.ipp2a1.colossus.nvidia.com:8333
    # api_key: junyix

  trace:
    # Everything this deployment writes for itself: run directories, engine
    # logs, perf metrics, the sbatch logs, and the fleet registration directory
    # the gateway watches (serve.sh derives all four from this one path). It is
    # `var/` inside the checkout deliberately -- these files are this
    # deployment's business and nobody else's, and keeping them beside the
    # scripts that produce them means one path to set rather than five.
    # gitignored, because the engine logs alone reach ~150 GB per instance over
    # the seven days a job may live.
    root: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TensorRT-LLM/examples/serve/large_scale_serving/var

    # The exception, and the only output another team consumes: the per-request
    # and per-response traces that tensorrt_llm/serve/request_trace.py writes.
    # Unset keeps them under the attempt directory like everything else.
    #
    # TRTLLMxKF holds both services' request traces, so each keeps to a
    # directory of its own under it -- `trace_data_gen` here, `trace_test`
    # for the test fleet. That separation is what makes this data usable for
    # training: a smoke test writing into this directory would be
    # indistinguishable afterwards from real campaign traffic. serve.sh still exports TRTLLM_REQUEST_TRACE_DIR as
    # <attempt>/request_trace and symlinks that to
    # <request_root>/<run>/<attempt>, so the bytes land here while every reader
    # -- analysis/, the rollup store, the dashboard collectors -- goes on
    # finding them where it always has.
    # Written as /scratch/fsw, not the /lustre/fsw symlink that names the same
    # directory. Only /scratch/fsw is bind-mounted into the workers, so the
    # symlinked spelling resolves to nothing inside the container: the writes
    # fail, the directory reads as empty, and nothing says so. serve.sh now
    # resolves this and warns when the target is outside every mount, but the
    # config should be right on its own.
    # Kernel-Trace traces are their own corpus: mixing them into
    # trace_data_gen would make them indistinguishable from the GLM-5.2
    # campaign traffic already collected there, and trace_test is the
    # debug fleet's. Baked at job submit -- changing this requires
    # restarting instances, not just editing.
    request_root: /scratch/fsw/portfolios/coreai/projects/coreai_kf_dev/users/junyix/TRTLLMxKF/trace_kernel_trace

# Ports are the one thing that must differ, and the range is not free to
# choose. Measured on a jhb GPU node, the system already listens on 8080, 8081,
# 8900, 9100, 9200 and 9400 -- 9400 is a container registry, which answers
# /health with 200 and therefore looks exactly like a working backend to the
# gateway while 404ing every real request. A colliding instance does not fail
# loudly: its worker dies on "Address already in use" and the gateway elects
# the squatter in its place.
#
# So both fleets live inside 8200-8880, which is clear of all six, and are
# spaced 20 apart because a disaggregated deployment binds the proxy port plus
# one per worker frontend -- an 8P1D instance uses port..port+9.

instances:
  # The Kernel-Trace pass, 2026-10-01: four 6P1D GLM-5.3-FP8 instances for
  # the 8045-problem mirror (was two 4P1D for the 1241-problem pass). The
  # measured bottleneck of the previous pass was large-prefill aggregate
  # throughput (~4.9K tok/s over 4 ctx workers; decode healthy at p50 86
  # tok/s), so capacity moves toward prefill: 6 ctx per gen, and four
  # instances instead of two. Each instance is (6+1) x 8 GPUs = 14 nodes in
  # one NVL72 block via `segment: auto`; the fleet is 56 nodes. The ctx
  # config keeps the TTFT settings added 2026-09-30 (kv-cache-aware routing,
  # fair_share_multiplier 64, max_batch_size 64). The FlashInfer cache
  # (flashinfer-glm53) is warm from ten days of FP8 production.
  - name: i00
    port: 8200
    topology: server_configs/glm5.3_disagg_6p1d.yaml
    ctx: server_configs/glm5.3_ctx_dep8_mtp.yaml
    gen: server_configs/glm5.3_gen_dep8_mtp.yaml
    # Single-rack + TCP, the same settings as i02 and i03 below, while the
    # RDMA rails are down cluster-wide (2026-10-07 OCI cluster-network
    # incident: rail ports DOWN, rail interfaces without addresses). With the
    # rails as UCX's only devices not even MPI can wire up ("no active
    # messages transport"). Return to the fleet default once the rails are
    # back.
    slurm:
      segment: 14
    server:
      env:
        UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
        UCX_NET_DEVICES: "eth0"

  - name: i01
    port: 8220
    topology: server_configs/glm5.3_disagg_6p1d.yaml
    ctx: server_configs/glm5.3_ctx_dep8_mtp.yaml
    gen: server_configs/glm5.3_gen_dep8_mtp.yaml
    # Single-rack + TCP while the RDMA rails are down; see i00.
    slurm:
      segment: 14
    server:
      env:
        UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
        UCX_NET_DEVICES: "eth0"

  - name: i02
    port: 8240
    topology: server_configs/glm5.3_disagg_6p1d.yaml
    ctx: server_configs/glm5.3_ctx_dep8_mtp.yaml
    gen: server_configs/glm5.3_gen_dep8_mtp.yaml
    # Single-rack, like i03 below and for the same reason: on two cross-rack
    # allocations in a row this instance's rc endpoints were reset on some
    # ctx->gen pairs (3% of KV transfers failed, then the gen worker
    # segfaulted).
    # 14 = every node of this 6P1D DEP8 instance in one NVL72 block. Not
    # `auto`: fleetctl resolves `auto` before merging instance overrides, so
    # here it would reach sbatch literally.
    slurm:
      segment: 14
    server:
      env:
        UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
        UCX_NET_DEVICES: "eth0"

  - name: i03
    port: 8260
    topology: server_configs/glm5.3_disagg_6p1d.yaml
    ctx: server_configs/glm5.3_ctx_dep8_mtp.yaml
    gen: server_configs/glm5.3_gen_dep8_mtp.yaml
    # Single-rack placement with the pre-2026-10-06 transport list: KV moves
    # over NVLink (cuda_ipc) inside the rack, TCP on eth0 carries only wireup.
    # Why not the fleet default (cross-rack, rc on the rails): on two
    # allocations in a row the rc endpoints between three of this instance's
    # six ctx workers and its gen worker were reset every few minutes (15% of
    # KV transfers failed, then the gen worker segfaulted), while i00 and i01
    # on the same settings had none in ~130K requests. Why not cross-rack TCP:
    # tried for 30 min - 0 failures, but GLM's 47.7 KB/token KV over eth0 left
    # ~30% of requests without a first token after 2 min (clients gave up).
    # 14 = every node of this 6P1D DEP8 instance in one NVL72 block. Not
    # `auto`: fleetctl resolves `auto` before merging instance overrides, so
    # here it would reach sbatch literally.
    slurm:
      segment: 14
    server:
      env:
        UCX_TLS: "cuda_ipc,cuda_copy,sm,self,tcp"
        UCX_NET_DEVICES: "eth0"

  # All three parked on 2026-09-18. The old queue finished -- every campaign
  # reached a terminal phase and the launcher is holding new starts -- so these
  # 22 nodes were serving zero requests. The next batch of problems runs from a
  # different queue and needs its configuration settled first; until then there
  # is nothing for the fleet to answer.
  #
  # Commented rather than cancelled alone, for the reason stated above: the
  # gateway's recover_lost_backends runs `fleetctl up`, which reconciles
  # against THIS list. Uncomment all three to resume.
  # - name: i00
  #   port: 8200
  #   topology: server_configs/glm5.2_disagg_4p1d.yaml
  #   ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
  #   gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  # Parked on 2026-09-16, not deleted. Kernel Factory caps one user at 500
  # active campaigns (409 "active campaign limit 500 reached for this user"),
  # which was 93% of every prepare failure that day, so the fleet could never
  # be fed past that however large it was: the launcher's own target of
  # 14 x 90 = 1260 was unreachable by construction. Six instances carry ~500
  # campaigns at 70 each, under the 90 a 6P1D instance was measured to take,
  # and the other eight were returning 74 nodes for nothing.
  #
  # Commented rather than removed because the gateway's recover_lost_backends
  # runs `fleetctl up`, which reconciles against THIS list -- cancelling the
  # jobs alone put all eight straight back within minutes. Uncomment to grow
  # the fleet again if the cap is ever raised.
  # - name: i01
  #   port: 8220
  #   topology: server_configs/glm5.2_disagg_6p1d.yaml
  #   ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
  #   gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  # - name: i02
  #   port: 8240
  #   topology: server_configs/glm5.2_disagg_6p1d.yaml
  #   ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
  #   gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  # - name: i03
  #   port: 8260
  #   topology: server_configs/glm5.2_disagg_6p1d.yaml
  #   ctx: server_configs/glm5.2_ctx_dep4_mtp.yaml
  #   gen: server_configs/glm5.2_gen_dep8_mtp.yaml

  # - name: i04
  # port: 8280
  # topology: server_configs/glm5.2_disagg_7p1d.yaml
